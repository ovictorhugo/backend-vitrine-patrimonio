services:
  vitrine_db:
    image: pgvector/pgvector:pg17
    container_name: vitrine_db
    volumes:
      - vitrine_db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vitrine
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  vitrine_api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gleidsoncosta/vitrine-api:latest
    entrypoint: ./entrypoint.sh
    container_name: vitrine_api
    ports:
      - "5055:8000"
    depends_on:
      - vitrine_db
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@vitrine_db:5432/vitrine
      CLIENT: 'http://localhost:8080'
    volumes:
      - storage:/app/vitrine/storage

volumes:
  vitrine_db:
  storage:
